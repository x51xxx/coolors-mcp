name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 1.0.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write # OIDC login to the official MCP Registry

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Verify package name
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          if [ "$PACKAGE_NAME" != "@trishchuk/coolors-mcp" ]; then
            echo "❌ Package name mismatch. Expected @trishchuk/coolors-mcp, got $PACKAGE_NAME"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests and build
        run: |
          pnpm run lint
          pnpm run build
          pnpm test

      - name: Verify build output
        run: |
          if [ ! -f "dist/bin/server.js" ]; then
            echo "❌ Build failed: dist/bin/server.js not found"
            exit 1
          fi
          echo "✅ Build output verified"

      - name: Create tarball and check size
        run: |
          pnpm pack
          SIZE=$(stat -c%s *.tgz)
          echo "📦 Package size: $SIZE bytes"
          if [ $SIZE -gt 10485760 ]; then
            echo "⚠️ Warning: Package size exceeds 10MB"
          fi

      - name: Publish to npm
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          body: |
            ## 🎨 Coolors MCP Release

            ### Installation
            ```bash
            # Claude Code
            claude mcp add coolors -- npx -y @trishchuk/coolors-mcp

            # Claude Desktop
            npm install -g @trishchuk/coolors-mcp
            ```

            ### What's Changed
            See below for the full changelog.

            ### Links
            - 📦 [NPM Package](https://www.npmjs.com/package/@trishchuk/coolors-mcp)
            - 📖 [Documentation](https://x51xxx.github.io/coolors-mcp/)
            - 🐛 [Report Issues](https://github.com/x51xxx/coolors-mcp/issues)

      # --- Official MCP Registry (registry.modelcontextprotocol.io) ---------
      # Runs after npm: the registry checks that the published npm version's
      # package.json has "mcpName" equal to server.json "name".
      - name: Sync server.json version with package.json
        run: |
          V=$(node -p "require('./package.json').version")
          jq --arg v "$V" '.version=$v | .packages[0].version=$v' server.json > server.json.tmp
          mv server.json.tmp server.json

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install mcp-publisher (signature-verified)
        env:
          MCP_PUBLISHER_VERSION: v1.8.9
        run: |
          set -euo pipefail
          asset=mcp-publisher_linux_amd64.tar.gz
          base=https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION
          curl -fsSLO "$base/$asset"
          curl -fsSLO "$base/$asset.sigstore.json"
          cosign verify-blob --bundle "$asset.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$MCP_PUBLISHER_VERSION" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$asset"
          tar xzf "$asset" mcp-publisher

      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
